<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Flashback Detectives</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap two"><main class="card" id="main"></main><aside class="card" id="side"></aside></div>
<script>
const O=(l,t,r,p,f,tip,next,x={})=>({l,t,r,p,f,tip,next,...x});
const ST={
embedded:{title:'The Lost Puppy',kind:'Embedded Flashback',icon:'🐶',blurb:'Tom finds a lost puppy. Where should the memory of his dog Max go, and how long should it be?',
rq:['Where did you place your embedded flashback? Why?','How long was it? Why was that the right length?','What did your flashback explain about Tom?','How is an embedded flashback different from a classical flashback?','One thing I learned about placing flashbacks:'],
n:{
open:{q:'How should your story begin?',o:[
O('Action opening','A small puppy whimpered under the bus stop.','g',20,'Strong hook! It grabs the reader straight away.','Starting with action makes readers want to read on.','approach'),
O('Setting description','The park was quiet that Sunday morning when Tom walked by.','o',10,'A bit slow. Readers wait a while for something to happen.','Try starting with action.','approach'),
O('Character description','Tom was a kind boy who loved animals.','b',5,"This is 'telling', not 'showing'.",'Let readers discover Tom is kind from what he does.','approach')]},
approach:{q:'What does Tom do when he sees the puppy?',o:[
O('Runs over and picks it up at once','Tom ran over and scooped up the puppy.','o',10,'It works, but it feels rushed.','Slower moments give a memory room to land.','place'),
O('Approaches slowly and gently','Tom knelt down and crept closer, speaking softly. Then he gently picked up the puppy. Its warmth reminded him of something...','g',20,'Good pacing! It builds an emotional connection.','A quiet, caring moment is perfect for a memory to surface.','place'),
O('Runs home to get food first','Tom raced home for some food, then hurried back and picked up the puppy.','b',5,"This breaks the story's momentum and can confuse the order of events.",'Keep the main action together so the flashback has a clear trigger.','place')]},
place:{q:"Should you add a flashback about Tom's old dog Max? Where?",o:[
O('RIGHT NOW (after picking up the puppy)','','g',0,'Nice! The puppy’s warmth is a natural trigger.','Now choose how long it should be.','len'),
O('LATER (during the search for the owner)','Tom carried the puppy through the neighbourhood, knocking on doors. No one recognised it.','g',0,'Searching is another good moment for a memory.','Now decide if Tom remembers something.','later'),
O('AT THE END (after the puppy is reunited)',"After an hour of searching, Tom found the puppy's owner. The grateful family thanked him warmly.\n\nAs Tom walked home, he thought about Max...",'o',10,'Too late for an embedded flashback. The main action is over.','Embedded flashbacks work DURING the action. This is more like a reflection.','sum'),
O("DON'T add a flashback","Tom searched for the owner and reunited them. The family thanked him and he went home happy.",'o',5,"The story works but we don't know WHY Tom cares so much.","A short flashback could show Tom's connection to animals. Try one when Tom picks up the puppy.",'sum')]},
len:{q:'How long should the flashback be?',o:[
O('Very brief (2–3 sentences)',"The puppy's warmth reminded Tom of Max, the dog he had lost last year. Max had been his best friend and had taught him to always help animals in need.",'g',25,"Excellent! Just enough to explain Tom's motivation, and the story flows on.",'Short and purposeful is the embedded way.','content',{ex:1}),
O('Medium (1 paragraph)',"The puppy's warmth reminded Tom of Max. A year ago, Max had been found abandoned at a shelter, scared and alone just like this puppy. Tom had promised that day to always help animals who needed him.",'g',20,'Good! Meaningful backstory. Perhaps a little long, but it works.','One paragraph is the most you need.','content',{ex:1}),
O('Long (3–4 paragraphs)',"The puppy's warmth reminded Tom of Max.\n\nThree years ago, Tom and his parents had visited the animal shelter. They had walked past many cages when Tom spotted a small brown puppy cowering in the corner...\n\n(…more paragraphs about training, playing, vet visits and saying goodbye…)\n\nTom blinked and looked down at the puppy in his arms.",'b',5,'Too long! We forgot about the puppy in Tom’s arms.','This looks like a CLASSICAL flashback, where the memory IS the story. Shorten it to 1 paragraph.','len',{ex:1,retry:1})]},
content:{q:'What should the flashback focus on?',o:[
O('What Max looked like','Tom remembered Max. Max had brown fur with white patches, long floppy ears, and a tail that wagged whenever Tom came home.','o',5,"Weak choice. It describes Max but doesn't explain why Tom cares about THIS puppy.",'Explain motivations or make a meaningful parallel. Don’t just describe.','sum',{ex:1}),
O('Finding Max abandoned (the parallel moment)','Tom remembered finding Max at the shelter, abandoned and scared just like this puppy. He had promised himself that day to always help animals who needed him.','g',30,"Excellent! Both dogs were abandoned, and the promise explains Tom's motivation.",'Perfect strategic use of an embedded flashback!','sum',{ex:1}),
O('Facts about dogs','Tom remembered having a dog. Dogs need food, water, exercise and lots of love every day.','b',0,'This is not a flashback! It is general information, not a specific memory.','A flashback must show a specific moment from the past.','content',{ex:1,retry:1})]},
later:{q:'As Tom searches, should he remember something about Max?',o:[
O('Yes: remember when Max ran away','Tom remembered the time Max had run away. He had searched for hours, knocking on every door, refusing to give up. That day taught him that caring and persistence could bring lost animals home.\n\nTom took a deep breath and knocked on the next door.','g',30,'Strategic placement! The two searches match, so the memory feels natural.','A parallel action is a great trigger.','sum',{ex:1}),
O('No, keep walking',"Tom kept walking, knocking on door after door until the puppy's owner opened theirs.",'o',5,'The story moves on, but we still don’t know why Tom works so hard.','Try the flashback to deepen the emotion.','sum')]}}},
classical:{title:'The Old Bicycle',kind:'Classical Flashback',icon:'🚲',blurb:'Mei finds her grandfather’s old bicycle. The memory of learning to ride IS the main story.',
rq:['Where did your story start and end? Why?','How did you move into the memory?','Why is the memory the main part of this story?','How is a classical flashback different from an embedded flashback?','One thing I learned about classical flashbacks:'],
n:{
open:{q:'How should your story begin?',o:[
O('In the present, with something that triggers a memory','Mei dusted off the rusty red bicycle in the storeroom. Its faded bell made her smile.','g',20,'Great start! The present scene has an object that can trigger the memory.','A classical flashback begins in the present, then slips into the past.','trigger'),
O('Jump straight into the past','Last summer, Mei learned to ride a bicycle.','o',5,'Good story, but it is not a flashback yet. The reader never sees the present.','Begin in the present so the memory has something to return to.','trigger'),
O('Describe the whole storeroom','The storeroom was dark and dusty. There were boxes, old chairs, paint tins and cobwebs everywhere.','o',10,'Nice detail, but nothing happens and nothing triggers a memory.','Choose one object in the present that will start the memory.','trigger')]},
trigger:{q:'How does Mei travel into the memory?',o:[
O('A touch and a feeling carry her back','As Mei pressed the faded bell, it went ring-a-ling, and she was seven years old again.','g',25,'Excellent! A clear trigger and a smooth transition.','Use a sound, smell, touch or object, then a time clue.','memory'),
O('"Suddenly it was last summer."','Suddenly, it was last summer.','o',10,'It works, but it is abrupt. The reader is not guided in.','Show what triggers the memory first.','memory'),
O('She falls asleep and dreams','Mei fell asleep on the old chair and began to dream.','o',5,'A dream is not a memory. Flashbacks show real events that already happened.','Pick a real trigger instead.','memory')]},
memory:{q:'How do you tell the memory?',o:[
O('Most of the story: a beginning, a problem and a climax','Grandpa had held the back of the seat as Mei wobbled down the lane. "Don\'t let go!" she cried. She wobbled, she tumbled, and her knee stung. But Grandpa only smiled. "Again," he said.\n\nOn the last try, his hands were gone. The wind rushed past as Mei pedalled all by herself.','g',30,'Excellent! In a classical flashback the memory IS the main story, so it has its own problem and climax.','Start with past perfect (had held), then use simple past.','back',{ex:1}),
O('One short sentence','She remembered learning to ride with Grandpa.','b',5,'That is an embedded flashback. Here the memory is the story.','Tell the memory in several paragraphs.','memory',{ex:1,retry:1}),
O('Lots of different memories, a few lines each','She remembered riding to the park, then the beach, then the market, then the library.','o',10,'Too scattered. No problem and no climax.','Pick ONE memory and tell it fully.','back',{ex:1})]},
back:{q:'How does the story return to the present?',o:[
O('The trigger brings her back','Ring! The bell sounded beneath Mei\'s thumb, and she was back in the dusty storeroom. She wheeled the bicycle into the sunshine. "Ready to ride again, Grandpa," she whispered.','g',25,'Excellent! The same trigger returns us, and the ending shows what the memory means to Mei.','Return with the same trigger you used to leave.','sum',{ex:1}),
O('Stay in the memory forever','Mei pedalled on and on, and the story ended there.','b',0,'The reader never comes back to the present.','A classical flashback returns to the present in the last paragraph.','back',{ex:1,retry:1}),
O('A sudden ending','Then Mei went to dinner.','o',10,'Abrupt. It does not link back to the memory.','Tell us how the memory changed or comforted the character.','sum',{ex:1})]}}},
linked:{title:'The New Boy',kind:'Linked Flashback',icon:'🎒',blurb:'Ravi sees a lonely new boy. A memory from last year teaches him how to act.',
rq:['What lesson did the memory teach Ravi?','How did the present situation link back to the memory?','How did Ravi act differently at the end?','How is a linked flashback different from a classical flashback?','One thing I learned about linked flashbacks:'],
n:{
open:{q:'How should your story begin?',o:[
O('In the present, with a trigger','At recess, Ravi saw a boy sitting alone on the canteen steps. His stomach twisted, because he knew that feeling.','g',20,'Great! The trigger is a present situation that connects to the past.','Linked flashbacks start with a situation that reminds the character of something.','memory'),
O('Setting description','Recess was loud and sunny, and everyone was playing.','o',10,'A bit slow, and nothing triggers a memory yet.','Show the situation that makes Ravi remember.','memory'),
O('Telling us the decision','Ravi decided to be kind to the new boy.','b',5,"This 'tells' the ending before the memory teaches the lesson.",'Let the memory explain why Ravi acts later.','memory')]},
memory:{q:'What should the memory show?',o:[
O('A moment that taught him a lesson','Last year, Ravi had been the new boy. He had stood alone by the fence for the whole of recess, and nobody had asked him to play. Then Lisa had waved. "Come and join us!" she had called. That small wave had changed his whole day, and Ravi had never forgotten it.','g',30,'Excellent! The memory shows a lesson: a small kindness matters.','The memory should teach the character something.','link',{ex:1}),
O('A description of his first day','Last year, Ravi had worn a stiff new uniform and carried a blue bag. The canteen had sold noodles and rice.','o',10,'Description, but no lesson to carry back to the present.','Choose a moment that teaches something.','link',{ex:1}),
O('A memory about winning a race','Last year, Ravi had won the school race and everyone had cheered.','b',5,'It has nothing to do with the present situation.','The memory must connect to what Ravi faces now.','memory',{ex:1,retry:1})]},
link:{q:'How do you link back to the present?',o:[
O('Show the situation is similar','Back on the steps, Ravi looked at the boy again. He was holding his lunch box tightly, just as Ravi once had.','g',25,'Excellent! The similar situation (second-last paragraph) links the memory to now.','Say or show how the present matches the past.','ending',{ex:1}),
O('Skip the link','Ravi stood up.','o',5,'The reader can’t see how the memory connects to now.','Add a sentence that links past and present.','ending',{ex:1})]},
ending:{q:'How does Ravi act at the end?',o:[
O('He acts differently because of the lesson','Ravi took a deep breath and walked over. He waved, just as Lisa once had. "Want to play with us?" The boy\'s face lit up.','g',30,'Excellent! The memory changed how Ravi acts.','In a linked flashback, the lesson changes what the character does.','sum',{ex:1}),
O('He ignores the boy','Ravi walked past. It was none of his business.','b',0,'Then the memory taught nothing.','Show Ravi using the lesson he remembered.','ending',{ex:1,retry:1}),
O('Tell us how he feels','Ravi felt kind and happy.','o',10,"This is telling, not showing.",'Show the new action that proves he learned.','sum',{ex:1})]}}}};
let T=null,U='',prog={completions:[],tries:0},st,cur,story,pts,perfect,t0;
try{T=localStorage.getItem('tok');U=localStorage.getItem('usr')||''}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'),paras=a=>a.map(t=>t.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')).join('');
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(r.status===401&&T&&!p.startsWith('log'))logout();if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
function logout(){T=null;try{localStorage.removeItem('tok')}catch(e){}login()}
function side(){const done=prog.completions.length,all=prog.completions.some(c=>c.perfect),B=[['First Steps',done>=1],['Persistent Learner',prog.tries>=1],['Flashback Architect',all],['Story Explorer',done>=3]];
$('side').innerHTML=`<h2>🔍 ${esc(U||'Flashback Detective')}</h2><div class="bar"><span class="pill">⭐ ${prog.completions.reduce((a,c)=>a+c.points,0)} pts</span><span class="pill">📚 ${done}/3 stories</span></div><h2>🏅 Badges</h2>${B.map(b=>`<span class="badge ${b[1]?'':'locked'}">${b[1]?'🏅':'🔒'} ${b[0]}</span>`).join('')}<h2>📘 Need help?</h2><p><a href="notes.html" target="_blank">Notes on the 3 flashbacks</a></p>${T?'<button class="alt" onclick="logout()">Log out</button>':''}`}
function login(msg){$('side').innerHTML='<h2>📘 Notes</h2><p><a href="notes.html" target="_blank">What are the 3 kinds of flashback?</a></p><p><a href="teacher.html">Teacher login</a></p>';
$('main').innerHTML=`<div style="font-size:2.4rem">🔍📖</div><h1>Flashback Detectives</h1><p>Log in to practise writing flashbacks.</p><label>Your username<input id="u" value="${esc(U)}" autocomplete="username"></label><label>PIN (4–8 numbers)<input id="p" type="password" inputmode="numeric" autocomplete="current-password"></label><label>Class (new pupils only)<input id="c" placeholder="e.g. 4A"></label><p class="err" id="e">${msg||''}</p><button class="go" onclick="auth('login')">Log in</button><button class="alt" onclick="auth('register')">I'm new: create my account</button>`}
async function auth(k){try{const d=await api(k,{username:$('u').value,pin:$('p').value,class:$('c').value});T=d.token;U=d.username;try{localStorage.setItem('tok',T);localStorage.setItem('usr',U)}catch(e){}menu()}catch(e){$('e').textContent=e.message}}
async function menu(){try{prog=await api('me')}catch(e){prog={completions:[],tries:0}}side();
$('main').innerHTML=`<h1>Pick a flashback story</h1><p>Each story teaches one kind of flashback. <a href="notes.html" target="_blank">📘 Read the notes first</a></p><div class="cards">${Object.keys(ST).map(k=>{const s=ST[k],c=prog.completions.find(x=>x.story===k);return `<div class="sc"><div class="i">${s.icon}</div><h2>${s.kind}</h2><b>${s.title}</b> ${c?(c.perfect?'⭐':'✅'):''}<p>${s.blurb}</p><button class="go" onclick="begin('${k}')">${c?'Play again':'Start'} ▶</button></div>`}).join('')}</div>`}
function begin(k){st=k;cur='open';story=[];pts=0;perfect=true;render()}
function render(){if(cur==='sum')return summary();const s=ST[st],n=s.n[cur];
$('main').innerHTML=`<h1>${s.icon} ${s.title} <small>· ${s.kind}</small></h1><div class="bar"><span class="pill">⭐ ${pts} pts</span></div><div class="story" id="st">${story.length?paras(story):'<p><i>Your story will appear here...</i></p>'}</div><h2>${n.q}</h2><div id="ch">${n.o.map((o,i)=>`<button class="c${i}" onclick="pick(${i})">${'ABCD'[i]}. ${o.l}</button>${o.ex?`<details><summary>👀 Show example</summary>${esc(o.t)}</details>`:''}`).join('')}</div><div id="fb"></div><button class="alt" onclick="menu()" style="margin-top:14px">⬅ Back to stories</button>`;
$('st').scrollTop=1e5;t0=Date.now()}
function log(o,retry){api('log',{story:st,node:cur,choice:o.l,rating:o.r,points:o.p,retry:retry?1:0,ms:Date.now()-t0}).catch(()=>{})}
function pick(i){const o=ST[st].n[cur].o[i],lab={g:'✅ Great choice!',o:'⚠️ Almost there',b:'❌ Let\'s rethink'};log(o,0);
document.querySelectorAll('#ch button').forEach(b=>b.disabled=true);
$('fb').innerHTML=`<div class="fbk ${o.r}"><b>${lab[o.r]}</b> ${o.retry?'':(o.p?'<b>+'+o.p+' pts</b>':'')}<p>${o.f}</p><p>💡 <b>Tip:</b> ${o.tip}</p></div>${o.retry?'':'<button class="go" id="k">Continue ▶</button>'}<button class="alt" id="a">↩ Try a different choice</button>`;
$('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
$('a').onclick=()=>{log(o,1);render()};if(!o.retry)$('k').onclick=()=>{if(o.t)story.push(o.t);pts+=o.p;if(o.r!=='g')perfect=false;cur=o.next;render()}}
function summary(){const s=ST[st];$('main').innerHTML=`<h1>🎉 Story complete!</h1><div class="story" style="max-height:none">${paras(story)}</div><p><b>Points: ${pts}</b> ${perfect?'⭐ Perfect run!':''}</p><h2>🧠 Reflection</h2>${s.rq.map((q,i)=>`<p>${i+1}. ${q}<textarea class="rf" rows="2"></textarea></p>`).join('')}<p class="err" id="e"></p><button class="go" onclick="finish()">Save my answers ▶</button>`}
async function finish(){try{await api('complete',{story:st,points:pts,perfect,reflection:[...document.querySelectorAll('.rf')].map(t=>t.value)});await menu();$('main').insertAdjacentHTML('afterbegin',`<div class="cert">🏆 <b>Flashback Detective Certificate</b><br>${esc(U)} finished <b>${ST[st].title}</b> with ${pts} points!</div>`)}catch(e){$('e').textContent=e.message}}
T?menu():login();
</script></body></html>
