<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Teacher Dashboard</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="card" id="m"></div><div id="d"></div></div>
<script>
let T=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
async function api(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function login(){$('d').innerHTML='';$('m').innerHTML=`<h1>🍎 Teacher Login</h1><label>Username<input id="u" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><p class="err" id="e"></p><button class="go" onclick="go()">Log in</button><a href="/">← Pupil page</a>`}
async function go(){try{T=(await api('login',{user:$('u').value,password:$('p').value})).token;load()}catch(e){$('e').textContent=e.message}}
async function load(){try{var s=await api('summary')}catch(e){return login()}
const K={embedded:'Embedded',classical:'Classical',linked:'Linked'},g={};
s.choices.forEach(c=>{const k=c.story+'|'+c.node;(g[k]=g[k]||{story:c.story,node:c.node,tot:0,bad:0,secs:0,rows:[]});const x=g[k];x.tot+=c.n;if(c.rating!=='g')x.bad+=c.n;x.secs=Math.max(x.secs,c.secs||0);x.rows.push(c)});
$('m').innerHTML=`<h1>🍎 Teacher Dashboard</h1><p>${s.pupils.length} pupils · ${s.completions.length} completed stories <button class="alt" style="display:inline-block;width:auto" onclick="load()">Refresh</button> <button class="alt" style="display:inline-block;width:auto" onclick="T=null;login()">Log out</button></p>`;
$('d').innerHTML=`<div class="card"><h2>Pupils</h2><table><tr><th>Name</th><th>Class</th><th>Stories</th><th>Points</th><th>Try-agains</th><th>Last active</th></tr>${s.pupils.map(p=>`<tr><td>${esc(p.username)}</td><td>${esc(p.class)}</td><td>${p.done}/3</td><td>${p.points}</td><td>${p.tries}</td><td>${esc(p.last_active||'-')}</td></tr>`).join('')}</table>
<h2>Reset a PIN</h2><input id="ru" placeholder="username"><input id="rp" placeholder="new PIN (4-8 digits)" inputmode="numeric"><button class="go" onclick="rst()">Reset PIN</button><p id="rm"></p></div>
<div class="card"><h2>Where pupils struggle (share of non-green choices, by step)</h2><table><tr><th>Story</th><th>Step</th><th>Choices</th><th>% not best</th><th>Most picked</th><th>Slowest avg (s)</th></tr>${Object.values(g).sort((a,b)=>b.bad/b.tot-a.bad/a.tot).map(x=>{const top=x.rows.sort((a,b)=>b.n-a.n)[0];return `<tr><td>${K[x.story]}</td><td>${esc(x.node)}</td><td>${x.tot}</td><td>${Math.round(100*x.bad/x.tot)}%</td><td>${esc(top.choice)} (${top.n})</td><td>${x.secs}</td></tr>`}).join('')}</table></div>
<div class="card"><h2>Completed stories and reflections</h2>${s.completions.map(c=>{let r=[];try{r=JSON.parse(c.reflection)}catch(e){}return `<details><summary><b>${esc(c.username)}</b> (${esc(c.class)}) · ${K[c.story]} · ${c.points} pts ${c.perfect?'⭐':''} · ${esc(c.ts)}</summary>${r.map((a,i)=>`<p>${i+1}. ${esc(a)||'<i>blank</i>'}</p>`).join('')}</details>`}).join('')||'<p>Nothing yet.</p>'}</div>`}
async function rst(){try{await api('reset-pin',{username:$('ru').value,pin:$('rp').value});$('rm').textContent='PIN reset ✔'}catch(e){$('rm').textContent=e.message}}
login();
</script></body></html>
