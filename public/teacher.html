<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Teacher Dashboard</title><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><div class="card" id="m"></div><div id="d" style="display:grid;gap:14px"></div></div>
<script>
let T=null,S=null,F='';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
async function api(p,b){const r=await fetch('/api/admin/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function login(m){$('d').innerHTML='';$('m').innerHTML=`<h1>🍎 Teacher Login</h1><label>Username<input id="u" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><p class="err" id="e">${m||''}</p><button class="go" onclick="go()">Log in</button><a href="/">← Pupil page</a>`}
async function go(){try{T=(await api('login',{user:$('u').value,password:$('p').value})).token;load()}catch(e){$('e').textContent=e.message}}
const title=id=>(S.stories.find(s=>s.id===id)||{title:id}).title,kind=id=>{const s=S.stories.find(x=>x.id===id);return s?S.types[s.type].kind:''};
async function load(){try{S=await api('summary')}catch(e){return login(e.message)}draw()}
function csv(){const rows=[['username','class','stories_done','points','try_agains','last_active']].concat(S.pupils.map(p=>[p.username,p.class,p.done,p.points,p.tries,p.last_active||'']),[[],['username','class','story','points','perfect','date']],S.completions.map(c=>[c.username,c.class,title(c.story),c.points,c.perfect?'yes':'no',c.ts]));
const t=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='flashback-detectives.csv';a.click()}
function draw(){const cls=[...new Set(S.pupils.map(p=>p.class||''))].sort(),inC=x=>!F||(x.class||'')===F;
const P=S.pupils.filter(inC),names=new Set(P.map(p=>p.username)),ok=x=>!F||names.has(x.username);
$('m').innerHTML=`<h1>🍎 Teacher Dashboard</h1><div class="tabs"><select id="cf" style="width:auto" onchange="F=this.value;draw()"><option value="">All classes</option>${cls.map(c=>`<option ${c===F?'selected':''} value="${esc(c)}">${esc(c)||'(no class)'}</option>`).join('')}</select><button class="alt sm" onclick="load()">Refresh</button><button class="alt sm" onclick="csv()">⬇ CSV</button><button class="alt sm" onclick="T=null;login()">Log out</button></div><p>${P.length} pupils · ${S.completions.filter(ok).length} completed stories</p>`;
const g={};S.choices.forEach(c=>{const k=c.story+'|'+c.node;const x=g[k]=g[k]||{story:c.story,node:c.node,tot:0,bad:0,secs:0,rows:[]};x.tot+=c.n;if(c.r!=='g')x.bad+=c.n;x.secs=Math.max(x.secs,c.secs||0);x.rows.push(c)});
const asg=new Set(S.assignments.map(a=>a.class+'|'+a.story));
$('d').innerHTML=`<div class="card"><h2>Pupils</h2><table><tr><th>Name</th><th>Class</th><th>Stories</th><th>Points</th><th>Try-agains</th><th>Last active</th></tr>${P.map(p=>`<tr><td><a href="#" onclick="drill('${esc(p.username)}');return false">${esc(p.username)}</a></td><td>${esc(p.class)}</td><td>${p.done}/${S.stories.length}</td><td>${p.points}</td><td>${p.tries}</td><td>${esc(p.last_active||'-')}</td></tr>`).join('')}</table><div id="dr"></div></div>
<div class="card"><h2>Where pupils struggle (all classes)</h2><table><tr><th>Story</th><th>Step</th><th>Picks</th><th>% not best</th><th>Most picked</th><th>Slowest (s)</th></tr>${Object.values(g).sort((a,b)=>b.bad/b.tot-a.bad/a.tot).slice(0,25).map(x=>{const t=x.rows.sort((a,b)=>b.n-a.n)[0];return `<tr><td>${esc(title(x.story))}</td><td>${esc(x.node)}</td><td>${x.tot}</td><td>${Math.round(100*x.bad/x.tot)}%</td><td>${esc(t.choice)} (${t.n})</td><td>${x.secs}</td></tr>`}).join('')}</table></div>
<div class="card"><h2>Pupil writing (add a comment)</h2>${S.writings.filter(ok).map(w=>`<details><summary><b>${esc(w.username)}</b> · ${esc(title(w.story))} · ${esc(w.ts)} ${w.comment?'💬':''}</summary><p>${esc(w.text)}</p><p><small>Checklist ticked: ${(JSON.parse(w.checks||'[]')).length}/5</small></p><textarea id="cm${w.id}" rows="2" placeholder="Comment for the pupil">${esc(w.comment)}</textarea><button class="go sm" onclick="cmt(${w.id})">Save comment</button></details>`).join('')||'<p>No writing yet.</p>'}</div>
<div class="card"><h2>Reflections</h2>${S.completions.filter(ok).map(c=>{let r=[];try{r=JSON.parse(c.reflection)}catch(e){}return `<details><summary><b>${esc(c.username)}</b> · ${esc(title(c.story))} · ${c.points} pts ${c.perfect?'⭐':''}</summary>${r.map((a,i)=>`<p>${i+1}. ${esc(a)||'<i>blank</i>'}</p>`).join('')}</details>`}).join('')||'<p>Nothing yet.</p>'}</div>
<div class="card"><h2>Assign stories to a class</h2>${F?`<p>Class <b>${esc(F)}</b> (assigned stories are pinned for these pupils)</p>${S.stories.map(s=>`<label class="chk"><input type="checkbox" ${asg.has(F+'|'+s.id)?'checked':''} onchange="asn('${s.id}',this.checked)"><span>${esc(s.title)} <small>(${esc(S.types[s.type].kind)})</small></span></label>`).join('')}`:'<p>Choose a class in the filter above.</p>'}</div>
<div class="card"><h2>Add a class list</h2><input id="bc" placeholder="Class, e.g. 4A" value="${esc(F)}"><textarea id="bn" rows="5" placeholder="One pupil name per line"></textarea><button class="go" onclick="bulk()">Create accounts</button><div id="bo"></div>
<h2>Reset a PIN / remove a pupil</h2><input id="ru" placeholder="username"><input id="rp" placeholder="new PIN (4-8 digits)" inputmode="numeric"><button class="go" onclick="rst()">Reset PIN</button><button class="alt" onclick="del()">Delete this pupil and their data</button><p id="rm"></p></div>`}
async function drill(u){try{const d=await api('pupil?u='+encodeURIComponent(u));$('dr').innerHTML=`<h2>${esc(u)}</h2><p>Sorting game: ${d.sorts.map(s=>s.score+'/'+s.total).join(', ')||'not played'}</p><table><tr><th>Story</th><th>Pts</th><th>Date</th></tr>${d.completions.map(c=>`<tr><td>${esc(title(c.story))}</td><td>${c.points} ${c.perfect?'⭐':''}</td><td>${esc(c.ts)}</td></tr>`).join('')}</table><details><summary>Last ${d.picks.length} choices</summary><table>${d.picks.map(p=>`<tr><td>${esc(title(p.story))}</td><td>${esc(p.node)}</td><td>${esc(p.choice)}</td><td>${p.r==='g'?'✅':p.r==='o'?'⚠️':'❌'}</td><td>${p.tries?'retry':''}</td></tr>`).join('')}</table></details>`}catch(e){$('dr').textContent=e.message}}
const done=async(f,m)=>{try{await f();if(m)$('rm').textContent=m;await load()}catch(e){alert(e.message)}};
const cmt=id=>done(()=>api('comment',{id,comment:$('cm'+id).value}));
const asn=(story,on)=>done(()=>api('assign',{class:F,story,on}));
async function bulk(){try{const d=await api('bulk',{class:$('bc').value,names:$('bn').value.split('\n')});const h=`<table><tr><th>Name</th><th>Username</th><th>PIN</th></tr>${d.created.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${x.pin}</td></tr>`).join('')}</table><p>Print or copy this list now. PINs are not shown again.</p>`;await load();$('bo').innerHTML=h}catch(e){alert(e.message)}}
const rst=()=>done(()=>api('reset-pin',{username:$('ru').value,pin:$('rp').value}),'PIN reset ✔');
const del=()=>{const u=$('ru').value;if(u&&confirm('Delete '+u+' and all their data?'))done(()=>api('delete-pupil',{username:u}),'Deleted')};
login();
</script></body></html>
